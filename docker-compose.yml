services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:4000

  ml:
    build: ./ml
    ports:
      - "8000:8000"
    environment:
      # 바코드 모듈(B 폴더: barcode_module.py, mapping.json, mapping_meta.json)
      - BARCODE_MODULE_DIR=/app/B
    volumes:
      - ./B:/app/B:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_started
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=1234
      - DB_NAME=fooddb
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      # 운영 배포 시 .env 파일 또는 셸 환경변수로 반드시 교체하세요 (예: openssl rand -hex 32)
      - JWT_SECRET=${JWT_SECRET:-safebite-dev-only-secret-change-me}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - ML_SERVICE_URL=http://ml:8000

  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=fooddb
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data

volumes:
  mysql_data:
  neo4j_data:
