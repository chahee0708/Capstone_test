version: "3.8"

# [추가] 모든 서비스 restart: unless-stopped
#   컨테이너가 죽거나 Docker Desktop 이 다시 켜지면 자동으로 다시 띄운다 (시연 중 서버가 꺼진 채로 남지 않게)
#   docker compose stop / down 으로 직접 끈 것은 다시 켜지 않는다

services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:4000

  ml:
    build: ./ml
    restart: unless-stopped
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    restart: unless-stopped
    # CLOVA OCR 키 전달용. .dockerignore 가 .env 를 이미지에서 제외하므로 여기서 넘긴다
    # 아래 environment 에 적힌 값이 우선하고, .env 가 없는 환경에서도 오류가 나지 않는다
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_started
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=1234
      - DB_NAME=fooddb
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - JWT_SECRET=safebite-jwt-secret-2024

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=fooddb
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:latest
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data

volumes:
  mysql_data:
  neo4j_data:
