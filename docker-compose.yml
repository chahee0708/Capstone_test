version: "3.8"

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:4000

  ml:
    build: ./ml
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    depends_on:
      - mysql
      - neo4j
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=1234
      - DB_NAME=fooddb
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123

  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=fooddb
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci # ← 추가
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  neo4j-loader:
    image: neo4j:latest
    volumes:
      - neo4j_data:/data
      - ./neo4j.dump:/dumps/neo4j.dump
    command: neo4j-admin database load neo4j --from-path=/dumps --overwrite-destination=true

  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data
    depends_on:
      neo4j-loader:
        condition: service_completed_successfully

volumes:
  mysql_data:
  neo4j_data:
